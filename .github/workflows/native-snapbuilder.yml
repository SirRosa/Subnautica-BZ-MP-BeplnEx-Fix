name: Native SnapBuilder experimental
on:
  push:
    branches: [test/native-port-loader-301]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build independent native plugin
        run: dotnet build src/NativeSnapBuilder/NativeSnapBuilder.csproj -c Release --nologo
      - name: Verify native plugin contract and grid math
        shell: pwsh
        run: |
          $out = "src/NativeSnapBuilder/bin/Release/net472"
          Add-Type -Path "$out/Subnautica.API.dll"
          Add-Type -Path "$out/Sirro.BZ.MP.NativeSnapBuilder.dll"
          $plugin = [Sirro.BZ.MP.NativeSnapBuilder.MainPlugin]::new()
          if ($plugin.PluginType.ToString() -ne "Client") { throw "Wrong plugin type" }
          $math = [Sirro.BZ.MP.NativeSnapBuilder.SnapMath]
          if ([Math]::Abs($math::PlaneAxis(1.37, 0, 0.5) - 1.5) -gt 0.00001) { throw "Grid snapping regression" }
          if ([Math]::Abs($math::PlaneAxis(1.37, 1, 0.5) - 1.37) -gt 0.00001) { throw "Surface normal regression" }
          if ([Math]::Abs($math::PlaneAxis(-1.37, 0, 0.5) + 1.5) -gt 0.00001) { throw "Negative snapping regression" }
          if ([Math]::Abs($math::PlaneAxis(1.37, 0, 0.1) - 1.4) -gt 0.00001) { throw "Fine snapping regression" }
          Write-Host "Native contract + math tests: PASS"
      - name: Package only the plugin DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src/NativeSnapBuilder/bin/Release/net472/Sirro.BZ.MP.NativeSnapBuilder.dll" "dist/"
          Compress-Archive -Path "dist/Sirro.BZ.MP.NativeSnapBuilder.dll" -DestinationPath "dist/Sirro-NativeSnapBuilder-0.1-experimental.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NativeSnapBuilder-0.1-experimental
          path: dist/Sirro-NativeSnapBuilder-0.1-experimental.zip
