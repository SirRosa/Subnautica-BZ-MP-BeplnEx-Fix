name: Construtor Zero stabilization
on:
  push:
    branches: [test/construtor-zero-301, test/construtor-zero-cfc-301, test/construtor-zero-stabilization-301, test/construtor-zero-gameplay-fixes-301, test/construtor-zero-placement-ui-301, test/construtor-zero-surface-lock-301]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Construtor Zero
        run: dotnet build src/ConstrutorZero/ConstrutorZero.csproj -c Release --nologo -warnaserror
      - name: Verify plugin type, snap grid, safety gates
        shell: pwsh
        run: |
          $out = "src/ConstrutorZero/bin/Release/net472"
          Add-Type -Path "$out/Subnautica.API.dll"
          Add-Type -Path "$out/Sirro.BZ.MP.ConstrutorZero.dll"
          $plugin = [Sirro.BZ.MP.ConstrutorZero.MainPlugin]::new()
          if ($plugin.PluginType.ToString() -ne "Client") { throw "Wrong plugin type" }
          $refs = $plugin.GetType().Assembly.GetReferencedAssemblies() | ForEach-Object { $_.Name }
          if ($refs | Where-Object { $_ -match "^(BepInEx|Nautilus|Subnautica.Client|Subnautica.Server)$" }) {
            throw "Forbidden dependency found in native DLL"
          }
          if ($plugin.Name -notlike "*Construtor Zero*") { throw "Wrong plugin name" }
          $math = [Sirro.BZ.MP.ConstrutorZero.SnapMath]
          if ([Math]::Abs($math::PlaneAxis(1.37, 0, 0.5) - 1.5) -gt 0.00001) { throw "Grid snapping regression" }
          if ([Math]::Abs($math::PlaneAxis(1.37, 1, 0.5) - 1.37) -gt 0.00001) { throw "Surface normal regression" }
          if ([Math]::Abs($math::PlaneAxis(-1.37, 0, 0.5) + 1.5) -gt 0.00001) { throw "Negative snapping regression" }
          if ([Math]::Abs($math::PlaneAxis(1.37, 0, 0.1) - 1.4) -gt 0.00001) { throw "Fine snapping regression" }
          if ([Math]::Abs($math::RotationAngle(47.0, 45) - 45) -gt 0.00001) { throw "Default rotation regression" }
          if ([Math]::Abs($math::RotationAngle(43.3, 5) - 45) -gt 0.00001) { throw "Fine rotation regression" }
          if ([Math]::Abs($math::RotationAngle(-44.0, 45) + 45) -gt 0.00001) { throw "Negative rotation regression" }
          $terrain = $math::SurfacePosition(1.37, 13.337, 2.74, 0, 1, 0, 0.5)
          if ([Math]::Abs($terrain[1] - 13.337) -gt 0.00001) { throw "Ground altitude must stay on hit plane" }
          if ([Math]::Abs($terrain[0] - 1.5) -gt 0.00001) { throw "Ground tangent snap regression" }
          if ([Math]::Abs($math::GroundPivotHeight(3.2, -0.95) - 4.15) -gt 0.00001) { throw "Floor contact height regression" }
          $building = $plugin.GetType().Assembly.GetType("Sirro.BZ.MP.ConstrutorZero.BuildingTweaksBridge", $true)
          $unsafe = $building.GetMethod("IsUnsafePlacementEnabled", [System.Reflection.BindingFlags]"Public, NonPublic, Static")
          if ($unsafe.Invoke($null, $null)) { throw "Unsafe placement must be disabled by default" }
          Write-Host "Build contract, grid math and multiplayer safety gates: PASS"
      - name: Run simulated multiplayer Builder Harmony integration checks
        run: dotnet run --project src/IntegrationHarness/IntegrationHarness.csproj -c Release --nologo
      - name: Package hardened RC without BepInEx, Nautilus or API stubs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src/ConstrutorZero/bin/Release/net472/Sirro.BZ.MP.ConstrutorZero.dll" dist/
          @"
          CONSTRUTOR ZERO v0.3.3-rc4 -- TERRAIN + CFC UI PERFORMANCE CANDIDATE
          BOT Benson Below Zero Multiplayer 3.0.1. Client plugin only.
          
          ALL TESTS IN CI ARE ABI CONTRACT OR SIMULATED NETWORK TESTS.
          REAL GAMEPLAY, TWO CLIENT SYNCHRONIZATION AND SERVER SAVE RESTORE
          HAVE NOT BEEN CERTIFIED. USE A BACKED-UP WORLD ONLY.
          
          Install identical Sirro.BZ.MP.ConstrutorZero.dll on both clients:
          %APPDATA%\.botbenson\Subnautica Below Zero\Game\Plugins\
          Do not copy Subnautica.API, the compile contract or any test fakes.
          Remove previous Construtor Zero / native SnapBuilder DLLs first.
          
          This release hardens:
          - Exact ItemId + TechType ACK from real multiplayer inventory
          - One-item-only server transfer; permanent in-session quarantine
          - Fabricator UI affordability extension without faking inventory
          - Deferred craft cancellation on Close, OnDeselect, mode/relock/disconnect
          - Building ghost and permission restoration / safe MP collision checks
          - Wall/ceiling snap and complete pose rollback on reflection exceptions
          - Fail-closed CFC after unexpected Unity/Harmony exceptions
          - Before auto-building, verify all missing recipe items are present
          - Scan already-placed lockers and match the real MP storage owner
          - Query ItemsContainer.GetItems by TechType without fake quantities
          - Snap on tangent plane: do not grid-round ground altitude
          - G enables furniture ONLY clipping (not base pieces or deconstruction)
          - Correct floor-object pivot against physical RaycastHit.point + Builder.bounds
          - Preserve original ground-only furniture permissions unless G is enabled
          - Cache all types of locker stock in one snapshot per 850ms
          - Pinned and fabricator tooltips display nearby ingredients green
          - Normal CFC transfer messages are silent on HUD by default
          - Actual auto-build action refreshes stock and blocks unsafe no-resource packets
          
          ALL AUTO TRANSFERS ARE DISABLED BY DEFAULT:
          %APPDATA%\.botbenson\Subnautica Below Zero\Game\Config\ConstrutorZero.Containers.ini
          IMPORTANT: existing .ini remains unchanged after upgrading DLL.
          Set auto_craft_enabled=true to use CFC in the Fabricator.
          The CFC_STORAGE_SCAN log shows scene_containers, registered and
          supported_lockers; if supported_lockers=0, attach client logs.
          Turn on auto_build_enabled=true for ordinary furniture, not base pieces.
          Keep auto_place_after_prefetch=false for initial 2-client tests.
          New option: show_cfc_messages=false (default, no HUD clutter).
          New option: ground_align=true in ConstrutorZero.ini.
          No setting is overwritten if its .ini file already exists.
          
          KNOWN LIMITATIONS:
          - No atomic server transaction/rollback for multi-item recipes
          - Limited to Locker and SmallLocker for network storage prefetch
          - No full SnapBuilder/Building Tweaks port or dynamic Attach to Target
          - G clips ordinary furniture only; structural base pieces are excluded
          - No base-piece CFC automatic building
          - No multiplayer free-ghost movement after collision check
          - An ACKed item ID cannot be re-requested until client rejoins
          - UI availability is advisory: server may reject a stale item
          
          See PLACEMENT-UI-301.md for current install and mandatory 2-client tests.
          See STABILIZATION-301.md for background limitations.
          Stop immediately if either player detects duplicate/lost items or desync.
          Preserve the server and BOTH client logs plus a backup of the world.
          
          Source commit: ${{ github.sha }}
          "@ | Set-Content "dist/README-PLACEMENT-UI.txt"
          Copy-Item "PLACEMENT-UI-301.md" "dist/PLACEMENT-UI-301.md"
          Compress-Archive -Path "dist/Sirro.BZ.MP.ConstrutorZero.dll", "dist/README-PLACEMENT-UI.txt", "dist/PLACEMENT-UI-301.md" -DestinationPath "dist/Construtor-Zero-0.3.3-rc4.zip" -Force
          Get-FileHash "dist/Sirro.BZ.MP.ConstrutorZero.dll" -Algorithm SHA256 | Format-List
          Get-Item "dist/Construtor-Zero-0.3.3-rc4.zip" | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Construtor-Zero-0.3.3-rc4
          path: dist/Construtor-Zero-0.3.3-rc4.zip
