name: Construtor Zero experimental
on:
  push:
    branches: [test/construtor-zero-301, test/construtor-zero-cfc-301]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Construtor Zero
        run: dotnet build src/ConstrutorZero/ConstrutorZero.csproj -c Release --nologo -warnaserror
      - name: Verify plugin type, snap grid, safety gates
        shell: pwsh
        run: |
          $out = "src/ConstrutorZero/bin/Release/net472"
          Add-Type -Path "$out/Subnautica.API.dll"
          Add-Type -Path "$out/Sirro.BZ.MP.ConstrutorZero.dll"
          $plugin = [Sirro.BZ.MP.ConstrutorZero.MainPlugin]::new()
          if ($plugin.PluginType.ToString() -ne "Client") { throw "Wrong plugin type" }
          $refs = $plugin.GetType().Assembly.GetReferencedAssemblies() | ForEach-Object { $_.Name }
          if ($refs | Where-Object { $_ -match "^(BepInEx|Nautilus|Subnautica.Client|Subnautica.Server)$" }) {
            throw "Forbidden dependency found in native DLL"
          }
          if ($plugin.Name -notlike "*Construtor Zero*") { throw "Wrong plugin name" }
          $math = [Sirro.BZ.MP.ConstrutorZero.SnapMath]
          if ([Math]::Abs($math::PlaneAxis(1.37, 0, 0.5) - 1.5) -gt 0.00001) { throw "Grid snapping regression" }
          if ([Math]::Abs($math::PlaneAxis(1.37, 1, 0.5) - 1.37) -gt 0.00001) { throw "Surface normal regression" }
          if ([Math]::Abs($math::PlaneAxis(-1.37, 0, 0.5) + 1.5) -gt 0.00001) { throw "Negative snapping regression" }
          if ([Math]::Abs($math::PlaneAxis(1.37, 0, 0.1) - 1.4) -gt 0.00001) { throw "Fine snapping regression" }
          if ([Math]::Abs($math::RotationAngle(47.0, 45) - 45) -gt 0.00001) { throw "Default rotation regression" }
          if ([Math]::Abs($math::RotationAngle(43.3, 5) - 45) -gt 0.00001) { throw "Fine rotation regression" }
          if ([Math]::Abs($math::RotationAngle(-44.0, 45) + 45) -gt 0.00001) { throw "Negative rotation regression" }
          $building = $plugin.GetType().Assembly.GetType("Sirro.BZ.MP.ConstrutorZero.BuildingTweaksBridge", $true)
          $unsafe = $building.GetMethod("IsUnsafePlacementEnabled", [System.Reflection.BindingFlags]"Public, NonPublic, Static")
          if ($unsafe.Invoke($null, $null)) { throw "Unsafe placement must be disabled by default" }
          Write-Host "Build contract, grid math and multiplayer safety gates: PASS"
      - name: Run simulated multiplayer Builder Harmony integration checks
        run: dotnet run --project src/IntegrationHarness/IntegrationHarness.csproj -c Release --nologo
      - name: Package first-test candidate without BepInEx, Nautilus or API stubs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src/ConstrutorZero/bin/Release/net472/Sirro.BZ.MP.ConstrutorZero.dll" dist/
          @"
          CONSTRUTOR ZERO v0.2.1-test -- FIRST CONTROLLED TEST CANDIDATE
          BOT Benson Below Zero Multiplayer 3.0.1. Client plugin only.

          FOR A DISPOSABLE COPY OF THE WORLD ONLY. NOT RELEASED FOR NORMAL PLAY.
          No gameplay session or 2-client server persistence test has passed yet.

          Install the same DLL on both clients:
          %APPDATA%\.botbenson\Subnautica Below Zero\Game\Plugins\
          Do not copy Subnautica.API.Contract or any fake assemblies.
          Remove prior Construtor Zero / NativeSnapBuilder DLLs first.

          Existing Snap/Building Tweaks are partial, not full original ports.
          CFC AUTOMATION IS DISABLED BY DEFAULT:
          %APPDATA%\.botbenson\Subnautica Below Zero\Game\Config\ConstrutorZero.Containers.ini
          1. Start and close the game once to generate the configuration.
          2. After testing ordinary building/snap, set auto_craft_enabled=true
             to test fabricator crafting from Locker/SmallLocker.
          3. Set auto_build_enabled=true for NORMAL FURNITURE ONLY.
             Keep auto_place_after_prefetch=false for the first session:
             the game will fetch ingredients, then the user clicks to place.
          4. manual_prefetch_enabled=true optionally allows F6 recipe prefetch.

          NOT SUPPORTED IN THIS CANDIDATE:
          - Full Attach to Target / dynamic parent hierarchy
          - Unsafe Full Override and MP deconstruction override
          - Craft/build directly from lockers without inventory staging
          - Atomic server transaction/rollback across all recipe items
          - Other storage types, base-piece automatic ingredient prefetch
          - Full SnapBuilder raycast, collider, AimTransform and PlaceTool parity

          Stop immediately if item quantities, placement or world sync disagree.
          Preserve BOTH client logs and the server log, plus steps and time.
          Consult FIRST-TEST-301.md in the GitHub branch for a detailed checklist.
          Source commit: ${{ github.sha }}
          "@ | Set-Content "dist/README-FIRST-TEST.txt"
          Compress-Archive -Path "dist/Sirro.BZ.MP.ConstrutorZero.dll", "dist/README-FIRST-TEST.txt" -DestinationPath "dist/Construtor-Zero-0.2.1-first-test.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Construtor-Zero-first-test-301
          path: dist/Construtor-Zero-0.2.1-first-test.zip
